name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Pull-request runs cancel a superseded run; a run on main gets its own group by
# run id, because GitHub also cancels a pending run that a newer run in the same
# group replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.pull_request.number != null }}

permissions:
  contents: read

jobs:
  checks:
    name: Sync check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action is pinned by commit and the tool it installs by version: an
      # unversioned `setup-uv` fetches whatever uv is newest, a run-time
      # resolution in a job that holds the GitHub token and produces the
      # coverage report the credentialed quality gate consumes. The pinned uv
      # must be a version the pinned action commit carries a checksum for:
      # setup-uv skips verification silently for a version it does not know.
      # Whoever merges a setup-uv bump checks this version against it.
      # The Python minor is pinned for the same reason, and it is the version
      # sonar-project.properties analyses this code as.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.4'
          python-version: '3.14'
      # The runner's Node is whatever the image ships; the coverage flags of the
      # workflow-test step need Node 22.8 or newer and --test-randomize needs 24.16, so the minor is pinned.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16'
      - name: Check generated agents
        run: python3 scripts/sync_agents.py --check
      # A tracked link dangles in every clone and install and can publish a
      # local path, as plugins/atelier/bin/uv did.
      - name: Refuse tracked symlinks
        run: |
          links=$(git ls-files -s | awk -F'\t' '$1 ~ /^120000 / { print "::error::tracked symlink: " $2 }')
          [ -z "$links" ] || { printf '%s\n' "$links" >&2; exit 1; }
      # Codex reads an instruction file only up to project_doc_max_bytes (default 32,768 bytes).
      - name: Hold the global contract under the Codex size limit
        run: |
          file=instructions/AGENTS.md
          limit=30000
          size=$(wc -c < "$file")
          echo "$file: $size bytes, limit $limit"
          [ "$size" -le "$limit" ] || { echo "::error file=$file::$file is $size bytes, over the $limit limit" >&2; exit 1; }
      # The contract files carry no dates or issue numbers.
      - name: Hold the global contract free of dates and issue numbers
        run: |
          hits=$(grep -nE '[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{4}|[0-9]{4}-[0-9]{2}-[0-9]{2}|#[0-9]+' instructions/*.md || [ $? -eq 1 ])
          [ -z "$hits" ] || { printf '%s\n' "$hits" >&2; echo "::error::instructions/ carries a date or an issue number" >&2; exit 1; }
      # The lane runs as one script bundled from plugins/atelier/lane/, so a
      # session reload cannot swap a part of a running lane; an empty
      # regeneration diff proves the committed script.
      - name: Check the generated lane script
        run: node scripts/build_lane.mjs --check
      - name: Check the plugin skills
        run: python3 scripts/check_skills.py
      # The Workflow tool refuses a script whose `meta` is not a pure literal,
      # so a workflow that parses fine still cannot start.
      - name: Check that workflow meta is a pure literal
        run: node scripts/check_workflow_meta.mjs plugins/*/workflows/*.js
      # The lcov report carries the JavaScript coverage the quality gate's Sonar scan reads;
      # the branch gate covers the scripts, as the pytest run below does for the Python ones.
      - name: Run workflow tests
        run: >-
          node --test --test-randomize --experimental-test-coverage
          --test-coverage-include='scripts/*.mjs' --test-coverage-branches=100
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          tests/*.test.mjs
      # `--locked` fails rather than re-resolving, so the closure this job
      # installs is the one uv.lock names and a stale lock is red here instead
      # of being silently updated.
      - name: Install the test dependencies from the lockfile
        run: uv sync --locked --no-build
      # Claude Code stops every session on a managed settings file it cannot
      # use, so the shipped file must pass the published settings schema.
      - name: Check the shipped Claude Code settings against the published schema
        run: >-
          uv run --locked --no-build
          check-jsonschema --schemafile https://json.schemastore.org/claude-code-settings.json
          settings/claude-managed.json
      # probe-run runs its command in a network namespace that pasta forms, and
      # its tests drive that namespace on this runner.
      - name: Install passt
        run: sudo apt-get install --yes --no-install-recommends passt
      - name: Run tests
        run: >-
          uv run --locked --no-build
          pytest tests -n auto --cov=scripts --cov=plugins/atelier/hooks --cov-branch --cov-report=xml:coverage.xml
          --cov-fail-under=100
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            lcov.info
          if-no-files-found: error

  quality:
    name: quality
    needs: [checks]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@9cc46a35d4fa874e96d0fc45e5c4871e06e093ec # v0.27.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
