sonar.organization=overnightworks
sonar.projectKey=overnightworks_marketplace

# The whole of `.github` is source, so everything under it that runs with the
# repository's own credentials is analysed — the workflows today, a composite
# action tomorrow. The markdown exclusion below keeps issue templates and the
# like out of scope.
sonar.sources=scripts,plugins,.github
sonar.tests=tests
sonar.exclusions=**/*.md
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=lcov.info
# A workflow script is a function body the Claude Code Workflow runtime evaluates
# (top-level `return`, injected `agent`), not an importable module, and most of it
# only composes prompts for real subagents. Node's coverage
# attributes nothing to plugins/atelier/workflows/lane.js, and even a sourceURL
# shim (shifting every line) reaches 44% from the input tests. Its stronger owners
# are tests/lane_workflow.test.mjs for the input contract and a real lane run for
# the orchestration. The sources under plugins/atelier/lane/ are the same kind of
# script, and the bundle is generated from them (sonar.cpd.exclusions keeps its
# copy of the sources out of the duplication measure).
sonar.coverage.exclusions=plugins/atelier/workflows/lane.js,plugins/atelier/lane/**
sonar.cpd.exclusions=plugins/atelier/workflows/lane.js
