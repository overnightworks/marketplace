name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Sync check and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Check generated agents
        run: python3 scripts/sync_agents.py --check
      - name: Run tests
        run: >-
          uvx --from pytest==9.1.1 --with pytest-cov==7.1.0 --no-build
          pytest tests -q --cov=scripts --cov-branch --cov-report=xml:coverage.xml
          --cov-fail-under=100
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build pinned gitleaks
        env:
          GOBIN: ${{ runner.temp }}
        run: go install github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
      - name: Scan for secrets
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --no-banner --verbose .'

  sonar:
    name: SonarCloud scan
    needs: checks
    # SONAR_TOKEN is empty for fork-originated pull requests, so skip the scan
    # there; the push to main and same-repo PRs still run it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The gate the scan waits on grades ratings, so this step asks the API
      # for open findings itself and names `issueStatuses`, never the legacy
      # `statuses` parameter, whose vocabulary drops an issue a person accepts
      # or marks false positive in the SonarCloud UI. Authentication is
      # mandatory — this SonarCloud project is private, and any scoped query
      # that was asked about nothing answers 200 with zero findings — so the
      # run proves its scope resolves before reading a zero as clean, with the
      # token as basic auth user name and an empty password, never printed.
      - name: SonarCloud open findings
        # The per-call timeout gives the honest message; this is the hard
        # ceiling, because the step pages and a per-call bound multiplies.
        timeout-minutes: 5
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          component_key="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            scope_name="pullRequest"
            scope_value="${PULL_REQUEST_NUMBER}"
          else
            scope_name="branch"
            scope_value="${GITHUB_REF_NAME}"
          fi
          python3 - "${component_key}" "${scope_name}" "${scope_value}" <<'PYTHON'
          import base64
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          # A SonarCloud that accepts the connection and then stops answering
          # must fail the job. This bounds one call; the step's own
          # timeout-minutes bounds the paging above it.
          REQUEST_TIMEOUT_SECONDS = 30

          component_key, scope_name, scope_value = sys.argv[1], sys.argv[2], sys.argv[3]
          scope_parameters = {scope_name: scope_value}
          scope_label = f"{scope_name}={scope_value}"
          credentials = base64.b64encode(f'{os.environ["SONAR_TOKEN"]}:'.encode()).decode()


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              # A redirect would forward the Authorization header to another
              # host; raise instead of following it.
              def redirect_request(self, *args, **kwargs):
                  return None


          opener = urllib.request.build_opener(NoRedirect())

          def timed_out(error: OSError) -> bool:
              # A read that runs out of time raises TimeoutError itself, while a
              # connect that does arrives wrapped in URLError.
              return isinstance(error, TimeoutError) or (
                  isinstance(error, urllib.error.URLError)
                  and isinstance(error.reason, TimeoutError)
              )

          def scoped_api_url(endpoint: str, **parameters: object) -> str:
              # The scope carries a branch name the runner derived, and a ref name
              # may legally contain characters a query string reads differently.
              query = urllib.parse.urlencode({**parameters, **scope_parameters})
              return f"https://sonarcloud.io/api/{endpoint}?{query}"

          def fetch(url: str) -> dict:
              request = urllib.request.Request(
                  url, headers={"Authorization": f"Basic {credentials}"}
              )
              try:
                  with opener.open(request, timeout=REQUEST_TIMEOUT_SECONDS) as response:
                      return json.load(response)
              except OSError as error:
                  if not timed_out(error):
                      raise
                  sys.exit(
                      f"SonarCloud did not answer within {REQUEST_TIMEOUT_SECONDS}s: "
                      f"the request for {component_key} in scope {scope_label} timed "
                      "out. Its findings were never read, so re-run the job before "
                      "investigating SonarCloud."
                  )

          def fetch_page(page: int) -> dict:
              return fetch(
                  scoped_api_url(
                      "issues/search",
                      componentKeys=component_key,
                      issueStatuses="OPEN,CONFIRMED,ACCEPTED,FALSE_POSITIVE",
                      ps=100,
                      p=page,
                  )
              )

          def require_resolved_scope() -> None:
              # An unauthenticated, misspelled or never-analysed scope answers
              # the issue search with zero findings and no error, so read the
              # measures of this exact scope first: it is 404 when the token,
              # the key or the scope does not resolve.
              try:
                  fetch(scoped_api_url("measures/component", component=component_key, metricKeys="ncloc"))
              except urllib.error.HTTPError as error:
                  sys.exit(
                      f"SonarCloud did not resolve {component_key} in scope "
                      f"{scope_label} (HTTP {error.code}): either no analysis "
                      "exists for this scope — an unanalysed branch, a pull "
                      "request that does not exist, a mistyped key — or the "
                      "credential cannot see the project. Its findings were "
                      "never read."
                  )

          require_resolved_scope()

          page = 1
          printed = 0
          total = None
          while total is None or printed < total:
              report = fetch_page(page)
              total = report["total"]
              for issue in report["issues"]:
                  file_path = issue["component"].split(":", 1)[1]
                  line = issue.get("line", "?")
                  print(f'{issue["rule"]} {file_path}:{line} {issue["message"]}')
                  printed += 1
              if not report["issues"]:
                  break
              page += 1

          if total > 0:
              print(f"{total} open SonarCloud finding(s) in scope {scope_label}", file=sys.stderr)
              sys.exit(1)

          # A step that prints nothing on success cannot be shown to have run.
          print(f"SonarCloud clean for '{component_key}' ({scope_label}): {total} open finding(s)")
          PYTHON
