sonar.organization=overnightworks
sonar.projectKey=overnightworks_marketplace

# The whole of `.github` is source, so everything under it that runs with the
# repository's own credentials is analysed — the workflows today, a composite
# action tomorrow. The markdown exclusion below keeps issue templates and the
# like out of scope.
sonar.sources=scripts,plugins,.github
sonar.tests=tests
sonar.exclusions=**/*.md
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# The "SonarCloud open findings" step (.github/workflows/ci.yml) queries the
# analysis right after this scan posts it; without waiting, that query can
# race a still-processing report and read stale (or absent) results.
sonar.qualitygate.wait=true
