version: 2
updates:
  # Every action this repository pins by commit SHA lives in
  # .github/workflows/*.yml; directory "/" is GitHub's documented value for
  # the github-actions ecosystem and covers that directory plus any
  # root-level action.yml (see overnightworks/marketplace#47).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # CI actions change rarely; a monthly bump that gets reviewed beats a
      # weekly one that gets ignored across six repositories. A security fix
      # is not gated by this interval once Dependabot security updates are
      # enabled for the repository (tracked separately, see PR description).
      interval: "monthly"
