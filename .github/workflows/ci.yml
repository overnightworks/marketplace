name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Sync check and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action is pinned by commit and the tool it installs by version: an
      # unversioned `setup-uv` fetches whatever uv is newest, a run-time
      # resolution in a job that holds the GitHub token and produces the
      # coverage report the credentialed `sonar` job consumes. The pinned uv
      # must be a version the pinned action commit carries a checksum for:
      # setup-uv skips verification silently for a version it does not know.
      # Whoever merges a setup-uv bump checks this version against it.
      # The Python minor is pinned for the same reason, and it is the version
      # sonar-project.properties analyses this code as.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.4'
          python-version: '3.12'
      - name: Check generated agents
        run: python3 scripts/sync_agents.py --check
      - name: Check the generated policy baseline
        run: python3 scripts/sync_agents_baseline.py --check
      - name: Check the repository layout
        run: python3 scripts/check_root_layout.py
      # The Workflow tool refuses a script whose `meta` is not a pure literal,
      # so a workflow that parses fine still cannot start.
      - name: Check that workflow meta is a pure literal
        run: node scripts/check_workflow_meta.mjs plugins/*/workflows/*.js
      # The lcov report carries the JavaScript coverage the `sonar` job reads.
      - name: Run workflow tests
        run: >-
          node --test --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          tests/*.test.mjs
      # `--locked` fails rather than re-resolving, so the closure this job
      # installs is the one uv.lock names and a stale lock is red here instead
      # of being silently updated.
      - name: Install the test dependencies from the lockfile
        run: uv sync --locked --no-build
      - name: Run tests
        run: >-
          uv run --locked --no-build
          pytest tests -q --cov=scripts --cov-branch --cov-report=xml:coverage.xml
          --cov-fail-under=100
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.xml
            lcov.info
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build pinned gitleaks
        env:
          GOBIN: ${{ runner.temp }}
        run: go install github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
      - name: Scan for secrets
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --no-banner --verbose .'

  sonar:
    name: SonarCloud scan
    needs: checks
    # SONAR_TOKEN is empty for fork-originated pull requests, so skip the scan
    # there; the push to main and same-repo PRs still run it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The gate the scan waits on grades ratings, so this step asks the API
      # for open findings itself. How it asks — the scoped query, the proof
      # that the scope resolves before a zero reads as clean, the credential
      # that never leaves a header — is owned by the action this repository
      # publishes, which every repository on the CI scanner names by commit.
      # This one names it by path, because it is the checkout it lives in.
      - name: SonarCloud open findings
        # The script bounds each call; this is the hard ceiling, because it
        # pages and a per-call bound multiplies. A composite action's own
        # steps take no timeout-minutes, so it belongs here.
        timeout-minutes: 5
        uses: ./.github/actions/sonar-findings-gate
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
