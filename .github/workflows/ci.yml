name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Sync check and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Check generated agents
        run: python3 scripts/sync_agents.py --check
      - name: Run tests
        run: >-
          uvx --from pytest==9.1.1 --with pytest-cov --no-build
          pytest tests -q --cov=scripts --cov-branch --cov-report=xml:coverage.xml
          --cov-fail-under=100
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build pinned gitleaks
        env:
          GOBIN: ${{ runner.temp }}
        run: go install github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
      - name: Scan for secrets
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --no-banner --verbose .'

  sonar:
    name: SonarCloud scan
    needs: checks
    # SONAR_TOKEN is empty for fork-originated pull requests, so skip the scan
    # there; the push to main and same-repo PRs still run it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scan step above blocks on the analysis (sonar.qualitygate.wait=true
      # in sonar-project.properties), so the report this reads is already
      # final. The quality gate itself passes on ratings (A/B/C), not on "0
      # findings on new code" (issue #143 in agent-claim); this queries
      # SonarCloud's `api/issues/search` directly for that stronger bar and
      # fails loud, with the list, when it is not met. The query names
      # `issueStatuses`, never the legacy `statuses` parameter, whose
      # vocabulary drops an issue a person accepts or marks false positive in
      # the SonarCloud UI — the gate would go green with the finding still in
      # the code. The SonarCloud project is private although this GitHub
      # repository is public, so the request authenticates with SONAR_TOKEN as
      # the HTTP basic auth user name and an empty password; the token is read
      # from the environment and never printed. Anonymously a private project
      # answers 200 with zero issues, which would let this gate pass forever.
      - name: SonarCloud open findings
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          component_key="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            scope_query="pullRequest=${PULL_REQUEST_NUMBER}"
          else
            scope_query="branch=main"
          fi
          python3 - "${component_key}" "${scope_query}" <<'PYTHON'
          import base64
          import json
          import os
          import sys
          import urllib.request

          component_key, scope_query = sys.argv[1], sys.argv[2]
          credentials = base64.b64encode(f'{os.environ["SONAR_TOKEN"]}:'.encode()).decode()


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              # A redirect would forward the Authorization header to another
              # host; raise instead of following it.
              def redirect_request(self, *args, **kwargs):
                  return None


          opener = urllib.request.build_opener(NoRedirect())

          def fetch_page(page: int) -> dict:
              url = (
                  "https://sonarcloud.io/api/issues/search"
                  f"?componentKeys={component_key}&{scope_query}&issueStatuses=OPEN,CONFIRMED,ACCEPTED,FALSE_POSITIVE&ps=100&p={page}"
              )
              request = urllib.request.Request(
                  url, headers={"Authorization": f"Basic {credentials}"}
              )
              with opener.open(request) as response:
                  return json.load(response)

          page = 1
          printed = 0
          total = None
          while total is None or printed < total:
              report = fetch_page(page)
              total = report["total"]
              for issue in report["issues"]:
                  file_path = issue["component"].split(":", 1)[1]
                  line = issue.get("line", "?")
                  print(f'{issue["rule"]} {file_path}:{line} {issue["message"]}')
                  printed += 1
              if not report["issues"]:
                  break
              page += 1

          if total > 0:
              print(f"{total} open SonarCloud finding(s) in scope {scope_query}", file=sys.stderr)
              sys.exit(1)
          PYTHON
